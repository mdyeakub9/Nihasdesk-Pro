# Dependency updates (SEC-20).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; remove once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
