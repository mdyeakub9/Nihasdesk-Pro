name: codeql

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      # CodeQL for C# (SEC-34); TypeScript is added with the frontend.
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Build
        run: dotnet build backend/Nihasdesk.slnx --configuration Release

      # Private repo without GitHub Code Security: keep results local instead of uploading,
      # and fail on any finding so CodeQL still blocks merge (SEC-34).
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: ignore

      - name: Fail on findings
        run: |
          count=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          echo "CodeQL findings: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif
            echo "::error::CodeQL found $count issue(s); see the codeql-sarif artifact"
            exit 1
          fi
