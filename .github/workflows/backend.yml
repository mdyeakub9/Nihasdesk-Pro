name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      # Lock files are committed; restore fails if they are out of date (SEC-20).
      - name: Restore
        run: dotnet restore Nihasdesk.slnx --locked-mode

      - name: Build
        run: dotnet build Nihasdesk.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Nihasdesk.slnx --no-build --configuration Release

      # Fail on known vulnerable packages, including transitive ones (SEC-20).
      - name: Vulnerable packages
        run: |
          dotnet list Nihasdesk.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qiE "\b(High|Critical)\b" vulnerable.txt; then
            echo "::error::High or critical vulnerable packages found"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Secret scanning in CI (SEC-34) with the pinned gitleaks image: needs no token or API access.
      # Also enable GitHub secret scanning + push protection in repo settings.
      - name: Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --exit-code 1
